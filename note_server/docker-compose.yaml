services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: note
      POSTGRES_PASSWORD: "vMkDThMZx7RmbP1rru6fD_X8cAHjncH2"
    volumes:
      - note_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "Rd3M7uAY7zyaKM4wIevVOlHKMiCYqn7T"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: note_test
      POSTGRES_PASSWORD: "gIZskguGqwbwkoZ3kBZQdgC1JomDb36m"
    volumes:
      - note_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "mzWxICI02yOaBp6KfW_3czMYF9RKw4qb"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  note_data:
  note_test_data:
